# The Job definition for the Ingest to Lakehouse strategy of rds_data_migration_1

resources:
  jobs:
    rds_data_migration_1_job:
      name: rds_data_migration_1_job
      tasks:
        - task_key: rds_ingest_task
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 2
            spark_env_vars:
              TARGET_CATALOG: ${var.catalog}
              TARGET_SCHEMA: ${var.schema}
              RDS_HOST: "sparkling-postgres-db.c3oweiuwo3lj.ap-southeast-1.rds.amazonaws.com"
              RDS_PORT: "5432"
              RDS_DATABASE: "sparkdb"
              RDS_USERNAME: "sparkadmin"
              RDS_PASSWORD: "SparkLing2026!"
          spark_python_task:
            python_file: ../src/rds_data_migration_1_etl/transformations/rds_ingest.py
          libraries:
            - maven:
                coordinates: org.postgresql:postgresql:42.7.3
