# The Job definition for the Ingest to Lakehouse strategy of rds_data_migration_1

resources:
  jobs:
    rds_data_migration_1_job:
      name: rds_data_migration_1_job
      tasks:
        - task_key: rds_ingest_task
          python_wheel_task:
            package_name: rds_data_migration_1
            entry_point: main
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--rds-host"
              - "sparkling-postgres-db.c3oweiuwo3lj.ap-southeast-1.rds.amazonaws.com"
              - "--rds-port"
              - "5432"
              - "--rds-database"
              - "sparkdb"
              - "--rds-username"
              - "sparkadmin"
              - "--rds-password"
              - "SparkLing2026!"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pypi:
                  package: psycopg2-binary==2.9.9
              - whl: ../dist/*.whl
