[project]
name = "rds_data_migration_1"
version = "0.0.1"
authors = [{ name = "huynguyen30593@outlook.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "psycopg2-binary>=2.9.9"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main        = "rds_data_migration_1_etl.transformations.rds_ingest:main"
incremental = "rds_data_migration_1_etl.transformations.rds_incremental:main"
reporting   = "rds_data_migration_1_etl.transformations.rds_reporting_transform:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
